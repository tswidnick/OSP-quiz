<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz – szkolenie podstawowe strażaka</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f2f5f9}*{box-sizing:border-box}
body{margin:0;padding:24px 14px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.app{width:min(760px,100%);background:#fff;border-radius:18px;padding:clamp(20px,5vw,38px);box-shadow:0 12px 40px #1b2b4418;margin:20px auto}
h1{font-size:clamp(23px,4vw,32px);margin:0 0 8px}.sub{color:#667085;margin:0 0 24px;line-height:1.5}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{background:#eef3ff;color:#244db4;padding:8px 12px;border-radius:30px;font-size:14px;font-weight:bold}
.track{height:8px;background:#e8edf4;border-radius:10px;overflow:hidden;margin:12px 0 25px}.bar{height:100%;width:0;background:#3267dc;transition:width .2s}
.q{font-size:20px;font-weight:700;line-height:1.45;margin:0 0 20px}
.answers{display:grid;gap:11px}.answer{border:2px solid #e1e6ee;background:#fff;border-radius:12px;padding:15px;text-align:left;font-size:16px;line-height:1.4;cursor:pointer;color:#172033;transition:.15s}
.answer:hover:not(:disabled){border-color:#7899e8;background:#f7f9ff}.answer:focus-visible,button:focus-visible{outline:3px solid #8aa9ff;outline-offset:2px}
.answer.correct{border-color:#22965b;background:#eaf8f0;color:#17643e}.answer.wrong{border-color:#d84b4b;background:#fff0f0;color:#a52d2d}.answer:disabled{cursor:default}
.feedback{display:none;margin-top:18px;padding:15px;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#eaf8f0;color:#17643e}.feedback.bad{background:#fff0f0;color:#922d2d}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
button.primary,button.secondary{border:0;border-radius:10px;padding:13px 20px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:#245bd2;color:white}.primary:hover{background:#194bb6}.secondary{background:#edf1f6;color:#344054}.secondary:hover{background:#e0e6ef}
button:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;padding:12px 0}.score{font-size:48px;font-weight:bold;color:#245bd2;margin:18px}.small{font-size:14px;color:#667085}
@media(max-width:480px){body{padding:10px}.app{margin:5px auto}.q{font-size:18px}.answer{font-size:15px;padding:13px}}
</style>
</head>
<body><main class="app">
<h1>Quiz – szkolenie podstawowe strażaka</h1>
<p class="sub">66 pytań z przesłanej bazy. Każdy test zawiera 11 pytań. Po zaznaczeniu odpowiedzi od razu zobaczysz prawidłową odpowiedź.</p>
<div id="quiz">
<div class="top"><span class="pill" id="set">Test 1 z 6</span><span class="small" id="counter">Pytanie 1 z 11</span><span class="pill" id="score">Wynik: 0</span></div>
<div class="track"><div class="bar" id="bar"></div></div>
<p class="q" id="question"></p><div class="answers" id="answers"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="secondary" id="restart" type="button">Od początku</button><button class="primary" id="next" type="button" disabled>Dalej</button></div>
</div>
<div id="result" class="result" hidden></div>
</main>
<script>
const questions = [{"q": "W gaśnicy na CO₂ (pot. „śniegowej”) piktogram grupy pożarowej oznaczony wielką literą „C” informuje o zastosowaniu urządzenia do gaszenia pożarów:", "a": ["cieczy palnych", "ciał stałych pochodzenia organicznego", "gazów palnych"], "correct": 2}, {"q": "Pożary ciał stałych topliwych zaliczamy do grupy pożarów:", "a": ["A", "B", "C"], "correct": 1}, {"q": "W Polsce przyjęty jest podział na następujące grupy pożarów:", "a": ["A B C D E F", "A B C D", "A B C D F"], "correct": 2}, {"q": "Zwyczajowe oznaczenie operacyjne samochodu ratowniczo-gaśniczego średniego to:", "a": ["GCBA", "GLBAM", "GBA"], "correct": 2}, {"q": "Który z symboli oznacza samochód ratowniczo-gaśniczy ciężki z autopompą:", "a": ["GBA", "GCBA", "GCBM"], "correct": 1}, {"q": "Oznaczenie M 8/8 informuje o następujących parametrach motopompy:", "a": ["wydajności nominalnej 8 hl/min przy wysokości podnoszenia 80 m H₂O", "wydajności 8 m³/godzinę przy nominalnym ciśnieniu 80 bar", "wydajności 8 hl/min przy nominalnej wysokości podnoszenia 8 Pa"], "correct": 0}, {"q": "Jakie wielkości nasad posiadają prądownice wodne?", "a": ["25, 52 i 75", "52, 75 i 110", "tylko 25 i 52"], "correct": 0}, {"q": "Nominalne natężenie przepływu wody w pożarniczym wężu tłocznym W-52 to:", "a": ["100 l/min", "200 l/min", "400 l/min"], "correct": 1}, {"q": "Nominalne natężenie przepływu wody w pożarniczym wężu tłocznym W-75 wynosi:", "a": ["800 l/min", "200 l/min", "1600 l/min"], "correct": 0}, {"q": "Co oznacza pojęcie „szybkie natarcie”?", "a": ["szybką akcję strażaków w celu ugaszenia pożaru", "linię gaśniczą trwale połączoną z wyznaczoną nasadą tłoczną samochodu gaśniczego, gotową do natychmiastowego użycia", "gaszenie pożaru przy pomocy gaśnicy"], "correct": 1}, {"q": "Drabinę D-10W winno sprawiać:", "a": ["1 ratownik", "2 ratowników", "4 ratowników"], "correct": 1}, {"q": "Sygnalizator akustyczny stosowany w sprzęcie ochrony dróg oddechowych informuje o:", "a": ["uruchomieniu rezerwy powietrza", "bezruchu ratownika", "zakończeniu rezerwy powietrza"], "correct": 0}, {"q": "Nożycami hydraulicznymi nie należy ciąć:", "a": ["koła kierownicy pojazdu", "sprężyn układu zawieszenia pojazdu", "poszycia drzwi pojazdu"], "correct": 1}, {"q": "Przed uruchomieniem agregatu prądotwórczego należy:", "a": ["uziemić agregat", "podłączyć urządzenia odbiorcze", "sprawdzić działanie urządzeń zabezpieczających"], "correct": 2}, {"q": "Co oznacza symbol Ex?", "a": ["urządzenie może pracować w wysokich temperaturach", "urządzenie jest w wykonaniu przeciwwybuchowym", "nie ma takiego oznaczenia"], "correct": 1}, {"q": "Do środków ochrony indywidualnej strażaka zaliczamy:", "a": ["hełm, buty strażackie, ubranie specjalne, rękawice specjalne, kominiarkę", "toporek, szelki ratownicze lub pas strażacki, zatrzaśnik", "ubranie i buty koszarowe"], "correct": 0}, {"q": "Kierowca ma obowiązek na polecenie dowódcy:", "a": ["zwiększyć prędkość jazdy", "zmniejszyć prędkość jazdy", "zignorować polecenia dowódcy w tym zakresie"], "correct": 1}, {"q": "Czy dowódca zastępu (sekcji) może nakazać kierowcy samochodu pożarniczego podczas jazdy alarmowej do zdarzenia szybszą jazdę?", "a": ["tak", "nie", "tylko wtedy, kiedy istnieje poważne zagrożenie życia lub mienia znacznej wartości"], "correct": 1}, {"q": "Rota to:", "a": ["dwuosobowy zespół ratowników, wchodzący w skład zastępu lub specjalistycznej grupy ratowniczej", "każdy dwuosobowy zespół ratowników", "kierowca i ratownik"], "correct": 0}, {"q": "Linia wężowa od hydrantu do pompy lub od pompy do kolejnej pompy to:", "a": ["linia główna", "linia zasilająca", "magistrala wodna"], "correct": 1}, {"q": "Sygnalizator bezruchu należy zakładać:", "a": ["każdorazowo w przypadku wejścia do strefy zagrożonej", "tylko w przypadku rozpoznania pożaru", "raz na pół roku"], "correct": 0}, {"q": "Czy numer operacyjny pojazdu pożarniczego jest w praktyce tożsamy z kryptonimem radiowym pojazdu?", "a": ["tak", "nie"], "correct": 0}, {"q": "Sygnał radiowy „Gejzer” oznacza:", "a": ["stanowisko wodne", "stanowisko z działkiem wodnym", "nakaz alarmowego opuszczenia strefy"], "correct": 2}, {"q": "Podstawowa zasada obowiązująca w sieciach radiowych to:", "a": ["maksimum czasu nadawania – maksimum treści", "minimum czasu nadawania – maksimum treści", "maksimum czasu nadawania – minimum treści"], "correct": 1}, {"q": "Jaki gaz o właściwościach wybuchowych wydziela się podczas ładowania akumulatorów kwasowych?", "a": ["metan", "etan", "wodór"], "correct": 2}, {"q": "Gaz propan-butan jest:", "a": ["cięższy od powietrza", "lżejszy od powietrza", "ma ciężar właściwy równy ciężarowi właściwemu powietrza"], "correct": 0}, {"q": "Ochotnicze Straże Pożarne są:", "a": ["stowarzyszeniami", "jednostkami organizacyjnymi PSP", "organami administracji rządowej"], "correct": 0}, {"q": "Jaki rodzaj drzewostanu jest najbardziej podatny na rozwój pożaru?", "a": ["iglasty", "liściasty", "mieszany"], "correct": 0}, {"q": "Pojemność zbiornika wodnego w samochodzie GCBA 5/24 wynosi:", "a": ["2400 l", "5000 l", "500 l"], "correct": 1}, {"q": "Do wytwarzania i podawania piany średniej służy:", "a": ["wytwornica pianowa", "prądownica pianowa", "agregat pianowy"], "correct": 0}, {"q": "Zaczadzenie następuje na skutek działania:", "a": ["azotu", "dwutlenku węgla", "tlenku węgla"], "correct": 2}, {"q": "Ciało obce możemy wyjąć z rany jeśli:", "a": ["nie usuwamy go wcale", "jest wbite w klatkę piersiową, a poszkodowany wymaga resuscytacji krążeniowo-oddechowej", "jeśli przedstawia ogromną wartość materialną"], "correct": 0}, {"q": "Ocenę oddechu poszkodowanego prowadzimy przez:", "a": ["1 min", "15 sek", "10 sek"], "correct": 2}, {"q": "Drabinę nasadkową możemy maksymalnie łączyć:", "a": ["z wielu przęseł, jeśli tylko mamy na wyposażeniu", "z czterech przęseł", "z dwóch przęseł"], "correct": 1}, {"q": "Do naturalnego gazu ziemnego dodaje się domieszkę nazwaną:", "a": ["neutralizatorem", "barwnikiem", "nawaniaczem"], "correct": 2}, {"q": "Co należy do czynności sprawdzających przed użyciem aparatu?", "a": ["sprawdzenie wilgotności sprężonego powietrza", "sprawdzenie ciśnienia w butli (butlach) i działania sygnalizatora", "sprawdzenie wagi aparatu"], "correct": 1}, {"q": "Zakres atmosfery wybuchowej to wartość stężenia substancji palnej (gazów, par lub pyłów):", "a": ["przy jak najwyższym stężeniu substancji wybuchowej", "pomiędzy dolną (DGW) a górną granicą wybuchowości (GGW)", "poniżej najniższego stężenia substancji palnej"], "correct": 1}, {"q": "Na przystanku autobusowym leży na brzuchu mężczyzna w wieku ok. 55 lat. Co robisz?", "a": ["zapewne jest pijany i wzywasz policję", "sprawdzasz oznaki życia", "wsiadasz do autobusu, bo nadjechał ten, na który czekałeś"], "correct": 1}, {"q": "U nieprzytomnej osoby dorosłej brak oddechu stanowi podstawę do podjęcia resuscytacji w schemacie:", "a": ["2 wdechy, 15 uciśnięć klatki piersiowej", "2 wdechy, 30 uciśnięć klatki piersiowej", "30 uciśnięć klatki piersiowej, 2 wdechy"], "correct": 2}, {"q": "Najczęstszą przyczyną zgonu u osób, które uległy zatruciu substancjami wpływającymi na funkcjonowanie centralnego układu nerwowego jest:", "a": ["działanie samej substancji trującej", "podawanie odtrutek przez osoby niewykwalifikowane", "utrata przytomności i niedrożność górnych dróg oddechowych"], "correct": 2}, {"q": "W stosunku do osoby, która w wyniku zatrucia straciła przytomność podejmiesz następujące czynności:", "a": ["podasz węgiel aktywowany jako odtrutkę i wezwiesz pomoc", "sprowokujesz wymioty i udasz się po pomoc", "przy zachowanym oddechu ułożysz poszkodowanego w pozycji bocznej bezpiecznej i wezwiesz pomoc"], "correct": 2}, {"q": "Podczas wykonywania defibrylacji:", "a": ["tylko ratownik może dotykać poszkodowanego", "nie ma znaczenia, kto dotyka poszkodowanego", "nikt nie może dotykać poszkodowanego"], "correct": 2}, {"q": "Który z gazów jest lżejszy od powietrza?", "a": ["gaz ziemny", "propan-butan", "dwutlenek węgla"], "correct": 0}, {"q": "Materiał lub substancję pochłaniającą oleje nazywamy:", "a": ["sorbentem", "dyspergentem", "neutralizatorem"], "correct": 0}, {"q": "Hełmy stosowane w Państwowej Straży Pożarnej w Polsce powinny mieć kolor:", "a": ["biały", "czerwony", "żółty"], "correct": 1}, {"q": "Do ubrań ochronnych nie zaliczamy:", "a": ["ubrania specjalnego", "ubrania chroniącego przed promieniowaniem cieplnym", "ubrania koszarowego"], "correct": 2}, {"q": "Stojak hydrantowy służy do:", "a": ["zassania wody z hydrantu podziemnego", "pobrania wody z hydrantu podziemnego", "poboru wody z hydrantu nadziemnego"], "correct": 1}, {"q": "Symbol Z-2500 oznacza:", "a": ["zasysacz liniowy o wydajności 2500 l/min", "zbiornik wodny składany o pojemności 2500 l", "zasysacz liniowy o liczbie spienienia 2500"], "correct": 1}, {"q": "Definicją pożaru jest:", "a": ["wystąpienie procesu spalania powodujące zagrożenie dla otoczenia", "niekontrolowany proces palenia w miejscu do tego nieprzeznaczonym", "każde zjawisko palenia budzące niepokój społeczeństwa, powodujące wezwanie jednostek ochrony przeciwpożarowej"], "correct": 0}, {"q": "Linia wężowa od nasady tłocznej rozdzielacza, pompy pożarniczej lub hydrantu zakończona prądownicą lub wytwornicą to:", "a": ["linia zasilająca", "linia główna", "linia gaśnicza"], "correct": 2}, {"q": "Będąc świadkiem napadu drgawek u chorego na ulicy należy:", "a": ["przy pomocy długopisu rozchylić usta poszkodowanego", "przytrzymać całe ciało, starając się wyhamować drgawki", "chronić głowę przed obrażeniami i podtrzymać drożność dróg oddechowych"], "correct": 2}, {"q": "Przeciętne stężenie tlenu w powietrzu atmosferycznym wynosi:", "a": ["10,11%", "20,95%", "27,18%"], "correct": 1}, {"q": "Jaka jest najpoważniejsza wczesna komplikacja porażenia prądem elektrycznym zmiennym?", "a": ["zaburzenia rytmu serca", "uraz kręgosłupa szyjnego", "niewydolność nerek"], "correct": 0}, {"q": "Samochód SH-50 oznacza:", "a": ["samochód specjalny holowniczy o mocy 500 KM", "samochód specjalny holowniczy o długości liny 50 m", "samochód specjalny z podnośnikiem hydraulicznym o wysięgu 50 m"], "correct": 2}, {"q": "Zjawisko konwekcji powoduje, że gazy pożarowe:", "a": ["ścielą się tuż przy ziemi", "unoszą się", "zjawisko konwekcji nie dotyczy gazów pożarowych"], "correct": 1}, {"q": "Pożary grupy F to pożar:", "a": ["pożary materiałów stałych", "pożary olejów i tłuszczów w urządzeniach kuchennych", "pożary cieczy i materiałów stałych topiących się"], "correct": 1}, {"q": "Według przepisów ADR o przewozie drogowym materiałów niebezpiecznych znak X w liczniku tablicy pomarańczowej określa:", "a": ["materiał niebezpiecznie reagujący z wodą", "substancje toksyczne i wybuchowe", "materiał promieniotwórczy"], "correct": 0}, {"q": "Z jednego litra wody powstaje:", "a": ["ok. 100 litrów pary wodnej", "ok. 1000 litrów pary wodnej", "ok. 1700 litrów pary wodnej"], "correct": 2}, {"q": "Pożary grupy D to pożar:", "a": ["pożary materiałów stałych", "pożary metali lekkich", "pożary cieczy i materiałów stałych topiących się"], "correct": 1}, {"q": "Jaki narząd jest najbardziej wrażliwy na niedotlenienie?", "a": ["serce", "mózg", "nerki"], "correct": 1}, {"q": "Jaka ustawa dotyczy organizacji i funkcjonowania OSP:", "a": ["ustawa z dnia 17 grudnia 2021 r. o Ochotniczych Strażach Pożarnych", "ustawa z dnia 6 kwietnia 1990 r. o Policji", "ustawa z dnia 27 kwietnia 2001 r. Prawo ochrony środowiska"], "correct": 0}, {"q": "Jak dzielimy zdarzenia zgodnie z zasadami ewidencjonowania zdarzeń ze względu na rodzaj:", "a": ["wypadki, zdarzenia medyczne, ataki terrorystyczne", "pomoc policji, działania PSP, działania OSP", "pożary, miejscowe zagrożenia, alarmy fałszywe"], "correct": 2}, {"q": "W jaki sprzęt powinien być wyposażony strażak wchodzący w strefę niebezpieczną:", "a": ["w ubranie koszarowe i maseczkę przeciwpyłową", "w ubranie specjalne, obuwie specjalne, kominiarkę, rękawice, hełm i aparat ochrony układu oddechowego (OUO)", "wyposażenie nie ma znaczenia"], "correct": 1}, {"q": "Kto powinien przejąć dowodzenie podczas zdarzenia, w którym uczestniczą zastęp OSP, zastęp OSP KSRG i zastęp JRG?", "a": ["dowódca zastępu OSP", "dowódca zastępu OSP KSRG", "dowódca zastępu JRG"], "correct": 2}, {"q": "Kto powinien przejąć dowodzenie podczas zdarzenia, w którym w danym momencie uczestniczą zastęp miejscowej OSP, zastęp sąsiedniej OSP i zastęp OSP KSRG?", "a": ["dowódca zastępu miejscowej OSP", "dowódca zastępu OSP KSRG", "dowódca zastępu sąsiedniej OSP"], "correct": 1}, {"q": "Kto powinien przejąć dowodzenie podczas zdarzenia, w którym w danym momencie uczestniczą zastęp OSP, zastęp miejscowej OSP KSRG i zastęp sąsiedniej OSP KSRG?", "a": ["dowódca zastępu OSP", "dowódca zastępu miejscowej OSP KSRG", "dowódca zastępu sąsiedniej OSP KSRG"], "correct": 1}];
const perSet=11;let setIndex=0,within=0,score=0,setScore=0,answered=false;
const $=id=>document.getElementById(id);
function render(){
 const index=setIndex*perSet+within, item=questions[index];answered=false;
 $('quiz').hidden=false;$('result').hidden=true;
 $('set').textContent=`Test ${setIndex+1} z 6`;$('counter').textContent=`Pytanie ${within+1} z 11`;$('score').textContent=`Wynik: ${setScore}`;
 $('bar').style.width=`${(within/perSet)*100}%`;$('question').textContent=`${index+1}. ${item.q}`;
 $('answers').innerHTML='';$('feedback').className='feedback';$('feedback').textContent='';
 item.a.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.addEventListener('click',()=>choose(i));$('answers').appendChild(b)});
 $('next').disabled=true;$('next').textContent=within===10?'Zakończ test':'Dalej';
}
function choose(choice){
 if(answered)return;answered=true;const item=questions[setIndex*perSet+within];
 [...$('answers').children].forEach((b,i)=>{b.disabled=true;if(i===item.correct)b.classList.add('correct');if(i===choice&&choice!==item.correct)b.classList.add('wrong')});
 const good=choice===item.correct;if(good){score++;setScore++}
 const f=$('feedback');f.className='feedback show '+(good?'good':'bad');
 f.innerHTML=good?'<strong>Poprawna odpowiedź!</strong><br>':'<strong>Niepoprawna odpowiedź.</strong><br>';
 const p=document.createElement('span');p.textContent='Prawidłowa odpowiedź: '+String.fromCharCode(65+item.correct)+'. '+item.a[item.correct];f.appendChild(p);
 $('score').textContent=`Wynik: ${setScore}`;$('bar').style.width=`${((within+1)/perSet)*100}%`;$('next').disabled=false;
}
function next(){
 if(!answered)return;
 if(within<10){within++;render();return}
 $('quiz').hidden=true;$('result').hidden=false;
 const completed=setIndex+1, percent=Math.round(setScore/perSet*100);
 $('result').innerHTML=`<span class="pill">Test ${completed} z 6 ukończony</span><h2>Twój wynik</h2><div class="score">${setScore} / 11</div><p>${percent}% poprawnych odpowiedzi</p><p class="small">Łączny wynik: ${score} / ${completed*11}</p>`;
 const action=document.createElement('button');action.className='primary';action.type='button';
 if(setIndex<5){action.textContent='Rozpocznij następny test';action.addEventListener('click',()=>{setIndex++;within=0;setScore=0;render()})}
 else{action.textContent='Rozwiąż ponownie od początku';action.addEventListener('click',reset)}
 $('result').appendChild(action);
}
function reset(){setIndex=0;within=0;score=0;setScore=0;render()}
$('next').addEventListener('click',next);$('restart').addEventListener('click',reset);render();
</script></body></html>
